<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">FAST-Calib offline GUI workflow</title>
  <desc id="desc">Dataset preparation, GUI review, feature detection, batch evaluation, optimization, and export.</desc>
  <rect width="1280" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(36 62)">
      <rect width="170" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="85" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Prepare</text>
      <text x="85" y="68" text-anchor="middle" font-size="14" fill="#334155">prepare-flat</text>
      <text x="85" y="92" text-anchor="middle" font-size="14" fill="#334155">image + PCD</text>
    </g>
    <line x1="220" y1="122" x2="284" y2="122" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(298 62)">
      <rect width="170" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="85" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Open Dataset</text>
      <text x="85" y="68" text-anchor="middle" font-size="14" fill="#334155">scan_dataset</text>
      <text x="85" y="92" text-anchor="middle" font-size="14" fill="#334155">samples root</text>
    </g>
    <line x1="482" y1="122" x2="546" y2="122" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(560 34)">
      <rect width="190" height="176" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="95" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Sample Review</text>
      <text x="95" y="68" text-anchor="middle" font-size="14" fill="#334155">Image ROI</text>
      <text x="95" y="92" text-anchor="middle" font-size="14" fill="#334155">Detect Camera Features</text>
      <text x="95" y="116" text-anchor="middle" font-size="14" fill="#334155">LiDAR ROI</text>
      <text x="95" y="140" text-anchor="middle" font-size="14" fill="#334155">Detect Plane / Holes</text>
    </g>
    <line x1="764" y1="122" x2="828" y2="122" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(842 62)">
      <rect width="170" height="120" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="85" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#7c2d12">Evaluate</text>
      <text x="85" y="68" text-anchor="middle" font-size="14" fill="#334155">Ready samples</text>
      <text x="85" y="92" text-anchor="middle" font-size="14" fill="#334155">Batch impact</text>
    </g>
    <line x1="1026" y1="122" x2="1090" y2="122" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(1104 62)">
      <rect width="140" height="120" rx="10" fill="#fdf2f8" stroke="#fbcfe8"/>
      <text x="70" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#831843">Export</text>
      <text x="70" y="68" text-anchor="middle" font-size="14" fill="#334155">T_cam_lidar</text>
      <text x="70" y="92" text-anchor="middle" font-size="14" fill="#334155">Reports</text>
    </g>
  </g>
</svg>
